name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # 테스트는 저장소에 커밋된 경량 runtime mart 만 읽는다.
      # data/raw, 학습용 대용량 mart, models 에 의존하는 테스트는 없으므로
      # 재현용 의존성(requirements-dev.txt)은 설치하지 않는다.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: pytest tests/ -q
